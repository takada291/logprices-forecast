<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丸太価格推移・予測ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // ここも測定IDに書き換えます
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
            color: #333;
        }
        /* ボタンのデザイン */
        .filter-buttons {
            margin-bottom: 15px;
        }
        .filter-buttons button {
            padding: 8px 16px;
            margin-right: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            background-color: #fff;
            border: 1px solid #007bff;
            color: #007bff;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: bold;
        }
        .filter-buttons button:hover {
            background-color: #007bff;
            color: #fff;
        }
        
        .chart-container {
            position: relative;
            height: 60vh;
            width: 100%;
        }
        .ai-insight {
            background-color: #f0f8ff;
            border-left: 5px solid #007bff;
            padding: 15px 20px;
            margin-top: 30px;
            border-radius: 4px;
        }
        .ai-insight h3 {
            margin-top: 0;
            color: #0056b3;
        }
        #prediction-text {
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>📈 丸太価格推移・予測ダッシュボード（全国平均）</h2>
    <p>農林水産省「木材流通統計調査」に基づく丸太価格の推移です。</p>

    <div class="filter-buttons">
        <button onclick="filterCategory('all')">すべて表示</button>
        <button onclick="filterCategory('seizai')">製材用</button>
        <button onclick="filterCategory('gohan')">合板用</button>
        <button onclick="filterCategory('chip')">チップ用</button>
    </div>

    <div class="chart-container">
        <canvas id="priceChart"></canvas>
    </div>

    <p style="text-align: right; font-size: 0.9em;">
    <a href="https://docs.google.com/spreadsheets/d/1ahCFzPUcDvLNgeG9uXLyH0asudpK2Xc--Dpy4USb0wI/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
        📊 丸太価格元データ
    </a>
    （Googleスプレッドシート）を閲覧できます。
    </p>

    <div class="ai-insight">
        <h3>💡 AIによる今後のトレンド予測</h3>
        <p id="prediction-text">予測データを読み込み中...</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
